<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#e96586">
<title>Ashu v0.9 — Desktop Companion</title>
<script src="tauri-bridge.js"></script>
<style>
:root{
  --bg:#FCF8FA; --ink:#28232C; --pink:#E96586; --soft-pink:#FFE8EF;
  --lilac:#EFE8FF; --mint:#E2F7E8; --card:#FFFFFF; --muted:#7A6E78;
  --line:#EFE7EC; --yellow:#FFF4D6; --yellow-ink:#7A6320; --danger:#C94F4F;
  --radius:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Telugu",sans-serif;
  background:#F3EEF1; color:var(--ink); display:flex; align-items:center; justify-content:center;
  min-height:100%; padding:0;
}
#phone{
  width:100%; max-width:430px; height:100dvh; max-height:920px; background:var(--bg);
  display:flex; flex-direction:column; position:relative; overflow:hidden;
  box-shadow:0 20px 60px rgba(60,20,40,.18);
}
@media(min-width:500px){ #phone{border-radius:26px; height:92dvh} }
.screen{flex:1; display:flex; flex-direction:column; overflow:hidden; position:relative}
.scroll{overflow-y:auto; flex:1; -webkit-overflow-scrolling:touch}
.topbar{display:flex; align-items:center; gap:6px; padding:12px 14px 8px}
.brand{font-weight:800; font-size:19px; line-height:1.05}
.brand small{display:block; font-weight:500; font-size:11px; color:var(--muted)}
.top-actions{margin-left:auto; display:flex; gap:4px}
.iconbtn{
  width:34px;height:34px;border-radius:12px;border:none;background:var(--lilac);
  font-size:15px; display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)
}
.iconbtn.pink{background:var(--soft-pink)}
.iconbtn:active{transform:scale(.94)}
.pad{padding:18px 20px}
h1.title{font-size:23px; margin:0 0 2px; font-weight:800}
p.sub{margin:0 0 12px; color:var(--muted); font-size:13px; line-height:1.5}
.card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; margin:8px 0}
.card.pink{background:var(--soft-pink); border-color:transparent}
.card.lilac{background:var(--lilac); border-color:transparent}
.card.mint{background:var(--mint); border-color:transparent}
.card.warn{background:var(--yellow); border-color:transparent; color:var(--yellow-ink)}
.card.danger{background:#FFE1E1; border-color:transparent}
.card b{font-size:14px}
.card p{margin:6px 0 0; font-size:13px; line-height:1.5}
.field{width:100%; border:1px solid #DED4DB; border-radius:14px; padding:12px 14px; font-size:14px;
  background:#fff; color:var(--ink); outline:none; font-family:inherit}
.field:focus{border-color:var(--pink)}
.field::placeholder{color:#B6ABB2}
label.lbl{font-size:12px; color:var(--muted); display:block; margin:8px 0 4px; font-weight:600}
.btn{width:100%; border:none; border-radius:16px; padding:14px; font-size:15px; font-weight:700;
  background:var(--pink); color:#fff; cursor:pointer; font-family:inherit}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn.sec{background:#fff; color:var(--ink); border:1px solid #DED4DB}
.btn.danger{background:var(--danger)}
.btn.sm{width:auto; padding:9px 14px; font-size:13px; border-radius:13px}
.row{display:flex; gap:8px; align-items:center}
.row.wrap{flex-wrap:wrap}
.switchrow{display:flex; align-items:center; padding:9px 0; gap:10px}
.switchrow span{flex:1; font-size:14px}
.sw{position:relative; width:46px; height:27px; flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw i{position:absolute; inset:0; background:#DDD3D9; border-radius:20px; transition:.18s; cursor:pointer}
.sw i:before{content:""; position:absolute; width:21px;height:21px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.18s; box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input:checked + i{background:var(--pink)}
.sw input:checked + i:before{transform:translateX(19px)}
input[type=range]{width:100%; accent-color:var(--pink)}
.chip{display:inline-flex; align-items:center; gap:4px; border-radius:999px; padding:5px 10px; font-size:11px; font-weight:600; background:var(--soft-pink)}
.chip.lilac{background:var(--lilac)} .chip.mint{background:var(--mint)} .chip.grey{background:#EFEAEE; color:var(--muted)}
.chiprow{display:flex; gap:5px; flex-wrap:wrap; min-height:24px}
.stepmeta{display:flex;align-items:center;justify-content:space-between;margin:10px 0 2px}.stepcount{font-size:11px;font-weight:800;color:var(--pink);background:var(--soft-pink);padding:4px 8px;border-radius:999px}.stepdots{display:flex; gap:6px; flex:1; margin:0 0 0 8px}
.stepdots i{height:6px; flex:1; border-radius:6px; background:#EBE2E8}
.stepdots i.on{background:var(--pink)}
/* chat */
.chatwrap{flex:1; overflow-y:auto; padding:8px 14px 8px; display:flex; flex-direction:column; gap:10px}
.bubble{max-width:82%; padding:11px 15px; border-radius:20px; font-size:14.5px; line-height:1.5; white-space:pre-wrap; word-break:break-word; box-shadow:0 1px 2px rgba(80,40,60,.06)}
.bubble.ashu{background:var(--soft-pink); align-self:flex-start; border-bottom-left-radius:7px}
.bubble.me{background:#fff; align-self:flex-end; border-bottom-right-radius:7px}
.bubble .meta{display:inline-flex;align-items:center;gap:4px;margin-top:7px;font-size:10px;color:var(--muted);font-weight:700;background:#fff;border:1px solid #E7DDE4;padding:3px 7px;border-radius:999px;cursor:help}.bubble .meta::before{content:"●";font-size:7px;color:var(--pink)}
.typing{align-self:flex-start; background:var(--soft-pink); padding:13px 16px; border-radius:20px; display:flex; gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:#C99; animation:bd 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bd{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
.notice{margin:0 14px; background:var(--yellow); color:var(--yellow-ink); border-radius:12px; padding:9px 12px; font-size:12px}
.composer{display:flex; gap:6px; align-items:flex-end; padding:8px 12px 12px; border-top:1px solid var(--line); background:var(--bg)}
.composer textarea{flex:1; resize:none; max-height:110px; border:1px solid #DED4DB; border-radius:18px; padding:11px 14px; font-size:14px; font-family:inherit; outline:none; background:#fff; color:var(--ink)}
.composer textarea:focus{border-color:var(--pink)}
.cbtn{width:42px;height:42px;flex:none;border-radius:14px;border:none;background:var(--lilac);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.16s}.cbtn:hover{transform:translateY(-1px)}
.cbtn.send{width:48px;height:48px;border-radius:16px;background:var(--pink);color:#fff;box-shadow:0 7px 16px rgba(233,101,134,.28);font-size:18px}.cbtn.send:active{transform:translateY(1px) scale(.97)}
.cbtn.listening{background:var(--danger); color:#fff; animation:pulse 1.1s infinite}
@keyframes pulse{50%{opacity:.6}}
/* chibi */
.chat-hero{display:grid;grid-template-columns:1fr 98px;gap:8px;align-items:stretch;min-height:104px;padding:4px 12px 2px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,0))}
.chat-hero-copy{display:flex;flex-direction:column;justify-content:center;min-width:0}
.chat-hero-avatar{display:flex;align-items:flex-end;justify-content:center;position:relative;overflow:visible}
#chibi{position:relative;top:auto;right:auto;width:94px;pointer-events:auto;z-index:2;cursor:pointer;filter:drop-shadow(0 8px 10px rgba(120,60,90,.14))}
#chibi img{width:100%;display:block;transform-origin:50% 92%;animation:breathe 3.2s ease-in-out infinite}
#chibi.speaking img{animation:speakingPulse .78s ease-in-out infinite}
#chibi.reply-pop img{animation:replyPop .48s cubic-bezier(.2,.85,.35,1.18)}
@keyframes speakingPulse{0%,100%{transform:scale(1) rotate(-1deg)}50%{transform:scale(1.045) rotate(1deg)}}
@keyframes replyPop{0%{transform:translateY(12px) scale(.9);opacity:.2}65%{transform:translateY(-4px) scale(1.04);opacity:1}100%{transform:translateY(0) scale(1);opacity:1}}
@keyframes breathe{0%,100%{transform:scale(1) rotate(-1.4deg)}50%{transform:scale(1.035) rotate(1.4deg)}}
#chibi.act-bounce img{animation:bounce .7s ease}
#chibi.act-spin img{animation:spin .9s ease}
#chibi.act-hide img{animation:hideShift 1s ease}
#chibi.act-shake img{animation:shake .5s ease}
@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-16px) scale(1.04)}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes hideShift{0%,100%{transform:translateX(0)}50%{transform:translateX(58px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px) rotate(-4deg)}75%{transform:translateX(7px) rotate(4deg)}}
.motion-off #chibi img{animation:none !important}.motion-off .typing i{animation:none !important}
/* v0.9 Part 8/10: floating companion demo bubble. Lives outside #phone so it
   can visually "float" over the whole prototype, mirroring the Android
   overlay Service being outside the chat Activity. */
#ashu-floating-demo{position:fixed;top:120px;left:16px;width:64px;height:64px;border-radius:50%;
  background:var(--card,#241a33);box-shadow:0 6px 18px rgba(0,0,0,.35);z-index:999;cursor:grab;
  touch-action:none;overflow:hidden;border:2px solid rgba(255,255,255,.18);transition:left .25s ease}
#ashu-floating-demo img{width:100%;height:100%;object-fit:cover}
#ashu-floating-demo.dragging{cursor:grabbing;transition:none}
#ashu-floating-demo.motion-off{transition:none}
/* onboarding portrait */
.hero{display:flex; justify-content:center; align-items:flex-end; height:200px; margin-bottom:4px}
.hero img{max-height:190px; animation:breathe 3.4s ease-in-out infinite}
/* bottom nav */
.nav{display:flex; border-top:1px solid var(--line); background:var(--bg); padding:6px 6px 8px}
.nav button{flex:1; border:none; background:none; font-size:10px; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 0; cursor:pointer; font-family:inherit}
.nav button b{font-size:17px; font-weight:400}
.nav button.on{color:var(--pink); font-weight:700}
.memcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin:6px 0}
.memcard .f{font-weight:600; font-size:14px}
.memcard .m{font-size:11px;color:var(--muted);margin-top:3px}
.memcard .acts{display:flex;gap:6px;margin-top:8px}
.tiny{font-size:11.5px;color:var(--muted);line-height:1.5}
.hr{height:1px;background:var(--line);margin:12px 0}
.pill{font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;background:#EFEAEE;color:var(--muted)}
.toast{position:absolute; bottom:80px; left:50%; transform:translateX(-50%); background:#28232C; color:#fff;
  padding:9px 15px; border-radius:12px; font-size:12.5px; opacity:0; transition:.25s; pointer-events:none; z-index:30; max-width:90%}
.toast.show{opacity:1}
.hidden{display:none !important}
a{color:var(--pink)}
.kbd{font-family:ui-monospace,Menlo,monospace;background:#EFEAEE;border-radius:5px;padding:1px 5px;font-size:11.5px}
</style>
</head>
<body>
<div id="phone"><div id="app" class="screen"></div><div id="toast" class="toast"></div></div>

 * acyclic by construction. */
const ASHU_STATE_DIRECT = {
  NEUTRAL:"ashu_v2_neutral", HAPPY:"ashu_v2_happy", EXCITED:"ashu_v2_excited",
  WINK:"ashu_v2_wink", CURIOUS:"ashu_v2_curious", SURPRISED:"ashu_v2_surprised"
};
const ASHU_STATE_LEGACY_LEAF = { SAD:"ashu_emo_sad", SLEEPY:"ashu_emo_sleepy" };
const ASHU_STATE_FALLBACK = {
  LAUGHING:"EXCITED", PLAYFUL:"WINK", CONFUSED:"CURIOUS", THINKING:"CURIOUS",
  SIDE_EYE:"ANNOYED", POUT:"ANNOYED", ANNOYED:"NEUTRAL", SARCASTIC:"ANNOYED",
  TIRED:"SLEEPY", CONCERNED:"CARING", CARING:"NEUTRAL", EMBARRASSED:"SURPRISED",
  PROUD:"HAPPY", TEASING:"PLAYFUL", LISTENING:"CURIOUS", SPEAKING:"HAPPY",
  REACTING:"SURPRISED", BORED:"NEUTRAL", ATTENTION:"CURIOUS"
};
function ashuAssetForState(state){
  if(ASHU_STATE_DIRECT[state]) return ASHU_STATE_DIRECT[state];
  if(ASHU_STATE_LEGACY_LEAF[state]) return ASHU_STATE_LEGACY_LEAF[state];
  let cur=state, guard=0;
  while(ASHU_STATE_FALLBACK[cur] && guard++<30){
    cur=ASHU_STATE_FALLBACK[cur];
    if(ASHU_STATE_DIRECT[cur]) return ASHU_STATE_DIRECT[cur];
    if(ASHU_STATE_LEGACY_LEAF[cur]) return ASHU_STATE_LEGACY_LEAF[cur];
  }
  return "ashu_v2_neutral";
}

/* ------------------------- memory commands ------------------------- */
const RE={
  recall:[/what do you (remember|know) (about me|about us)/i,/what do you remember/i,/neeku naa gurinchi em (gurthu|telusu)/i,/na gurinchi em gurthu/i],
  remember:[/^\s*remember (that )?(.+)/i,/^\s*(please )?remember[:,]?\s*(.+)/i,/gurthu pettuko[:,]?\s*(.+)/i,/note (this|that)[:,]?\s*(.+)/i],
  forgetLast:[/forget (what i (just )?(told|said))/i,/forget (that|this|it)/i,/delete (that|this) memory/i],
  forgetTopic:[/^forget (about )?(.+)/i,/^delete (the )?memory (about )?(.+)/i,/gurthu (teesey|chesi) (.+)/i],
  wipe:[/delete everything (you know )?about me/i,/forget everything/i,/erase (all )?(my )?(data|memories)/i,/wipe (all )?(my )?(data|memory)/i,/annai? (delete|erase) chey/i],
  search:[/search (your )?memory for (.+)/i,/what do you know about (.+)/i]
};
function matchAny(list,t){ for(const r of list){const m=t.match(r); if(m) return m;} return null; }
function isSensitive(t){
  const s=t.toLowerCase();
  return /\b(password|passcode|otp|api[_ -]?key|secret|token|credit card|cvv|aadhaar|aadhar|ssn|pin)\b/.test(s)
      || /\b\d{12,}\b/.test(s);
}
function stageOrder(){ return ["formal","acquaintance","comfortable_friend","best_friend","close_companion"]; }
function dailyInitiations(){ const d=new Date().toDateString(); return (S._initDay===d)?(S._initCount||0):0; }

function handleMemoryCommand(text, confirmed){
  const t=(text||"").trim(); const low=t.toLowerCase(); if(!t) return {handled:false};

  // A previous wipe prompt is open and the user just confirmed it. The confirm
  // phrase itself ("yes, delete everything") matches no wipe regex, so handle it
  // here rather than relying on the pattern table.
  if(confirmed){
    const removed=S.memories.length; S.memories=[]; S.people=[]; S.activity=[]; S.pendingWipe=false;
    return {handled:true,action:"wipe",text:"Sare. Naa daggara unna antha data delete chesesa. Ippudu nuvvu clean slate.",data:{removed}};
  }

  if(matchAny(RE.wipe,low)){
    if(!confirmed) return {handled:true,action:"wipe",requiresConfirmation:true,
      text:"Serious ga chepthunna: nenu store chesina **anni** memories, people, activity history delete avutayi. Idi undo cheyyalem. Confirm chesthe 'yes, delete everything' ani cheppu."};
    const removed=S.memories.length; S.memories=[]; S.people=[]; S.activity=[];
    return {handled:true,action:"wipe",text:"Sare. Naa daggara unna antha data delete chesesa. Ippudu nuvvu clean slate.",data:{removed}};
  }
  if(matchAny(RE.recall,low)){
    const lines=[];
    if(S.memories.length){ lines.push("Naaku gurthu unna vishayalu:"); S.memories.slice(0,15).forEach(f=>lines.push("  • ["+f.category+"] "+f.fact)); }
    if(S.people.length){ lines.push("Important people:"); S.people.slice(0,8).forEach(p=>lines.push("  • "+p.name+" — "+p.relationship)); }
    if(!lines.length) return {handled:true,action:"recall",text:"Inka naaku peddhaga em gurthu ledu ra. Nuvvu cheppu, nenu gurthu pettukunta."};
    return {handled:true,action:"recall",text:lines.join("\n")};
  }
  const sm=matchAny(RE.search,low);
  if(sm){
    const q=sm[sm.length-1]||""; const hits=S.memories.filter(f=>f.fact.toLowerCase().includes(q.toLowerCase()));
    if(!hits.length) return {handled:true,action:"search",text:"'"+q.trim()+"' gurinchi naaku em gurthu ledu ra."};
    return {handled:true,action:"search",text:"'"+q.trim()+"' gurinchi idi naaku gurthu undi:\n"+hits.map(h=>"  • "+h.fact).join("\n")};
  }
  if(matchAny(RE.forgetLast,low)){
    if(!S.memories.length) return {handled:true,action:"forget",text:"Delete cheyyadaniki em ledu ra, memory already khaali."};
    const last=S.memories[S.memories.length-1]; S.memories=S.memories.filter(f=>f.id!==last.id);
    return {handled:true,action:"forget",text:"Sare, adi marchipoyanu.",data:{deleted:last.fact}};
  }
  const ft=matchAny(RE.forgetTopic,low);
  if(ft){
    const topic=(ft[ft.length-1]||"").trim();
    if(topic && !/^(everything|all)$/i.test(topic)){
      const before=S.memories.length;
      S.memories=S.memories.filter(f=>!f.fact.toLowerCase().includes(topic.toLowerCase()));
      const removed=before-S.memories.length;
      return {handled:true,action:"forget",text: removed? "'"+topic+"' gurinchi unna "+removed+" memory(s) delete chesa." : "'"+topic+"' gurinchi naaku em ledu ra."};
    }
  }
  const rm=matchAny(RE.remember,low);
  if(rm){
    const content=(rm[rm.length-1]||"").trim().replace(/^[ .!?\n]+|[ .!?\n]+$/g,"");
    if(!content) return {handled:true,action:"remember",text:"Em gurthu pettukovali ra? Cheppu."};
    if(isSensitive(content)) return {handled:true,action:"remember",text:"Adi sensitive information la undi (password/OTP/key). Nenu avi store cheyyanu ra. Vere vishayalu cheppu."};
    addFact(content,"user_note","user","explicit",1.0);
    logActivity("memory","add",content.slice(0,120),true);
    return {handled:true,action:"remember",text:"Sare, gurthu pettukunna ✅",data:{fact:content}};
  }
  return {handled:false};
}
function addFact(fact,category,source,memory_type,confidence,pinned){
  if(S.memories.some(m=>m.fact.toLowerCase()===fact.toLowerCase())) return false;
  const f={id:uid(),category:category||"user_note",fact,source:source||"user",
    memory_type:memory_type||"auto",confidence:(confidence==null?0.9:confidence),pinned:!!pinned,
    created_at:nowISO(),updated_at:nowISO()};
  S.memories.push(f); save(); return true;
}
function autoCapture(text){
  if(!S.autoMemory || isSensitive(text)) return;
  const pats=[
    [/\b(?:i like|i love|i enjoy|naaku istam)\s+(.+)/i,"preference",0.8],
    [/\b(?:i hate|i don't like|naaku nachadu)\s+(.+)/i,"dislike",0.8],
    [/\b(?:my goal is|my goal:)\s+(.+)/i,"goal",0.9],
    [/\b(?:i am working on|i'm working on|working on)\s+(.+)/i,"project",0.85],
    [/\b(?:my favou?rite\s+\w+\s+is)\s+(.+)/i,"preference",0.9]
  ];
  for(const [re,cat,conf] of pats){
    const m=text.match(re); if(!m) continue;
    const fact=m[1].trim().replace(/[.!?\n]+$/,"");
    if(fact.length>=3 && fact.length<=180){ if(addFact(fact,cat,"auto","auto",conf)) logActivity("memory","auto",fact.slice(0,120),true); if(cat==="project"||cat==="goal") S.conversationContext=fact; }
  }
  const pm=text.match(/\b([A-Z][a-zA-Z]{1,20}) is my (\w[\w\s]{2,30}?)(?:[.,]|$)/);
  if(pm){ const name=pm[1], rel=pm[2].trim();
    if(!S.people.some(p=>p.name.toLowerCase()===name.toLowerCase())) S.people.push({name,relationship:rel});
  }
  // name introduction
  const nm=text.match(/\b(?:my name is|i am|i'm)\s+([A-Za-z][A-Za-z .'-]{1,30})/i);
  if(nm && !S.name){ const cand=nm[1].trim().split(/\s+/)[0]; if(cand.length>1){ S.name=cand; } }
  save();
}

/* ------------------------- mood + relationship ------------------------- */
function inferMood(text){
  const s=(text||"").toLowerCase();
  if(/\b(happy|khush|santhosham|excited|yay|party)\b/.test(s)) return "happy";
  if(/\b(sad|depress|badha|tension|stress|alone|lonely|cry)\b/.test(s)) return "caring";
  if(/\b(bore|boring|bored|time pass|jobless)\b/.test(s)) return "playful";
  if(/\b(sleep|nidra|tired|sleepy)\b/.test(s)) return "sleepy";
  if(/\b(angry|kopam|frustrat|irritat)\b/.test(s)) return "annoyed";
  if(/\b(jealous|evaru|who is she|who is he)\b/.test(s)) return "jealous";
  if(/\b(wow|omg|surprise|nijamga)\b/.test(s)) return "surprised";
  if(/\b(proud|achieved|completed|done it|passed)\b/.test(s)) return "proud";
  if(/\?$/.test(s)) return "curious";
  return "calm";
}

  if(isQ) return reply(pick([
    "Hmm, adi bagunna question ra. Idi naa rule-brain mode — full ga alochinchadaniki Settings lo live bridge/local model connect cheyyali. Kani nee version cheppu, kalisi discuss cheddam 🤔",

    "Adi naaku interesting ga undi. Offline ga unna kani nee point vintunna. Elaborate chey ra 😌"
  ]),"curious","thinking","rules");

  return reply(pick([
    "Mm, vintunna ra. Inka cheppu 😊",
    "Sare. Nee day ela nadustundi?",

  ]),"calm","look_at_user","rules");

/* ------------------------- live bridge ------------------------- */
async function bridgeFetch(path,opts){
  const base=(S.bridgeUrl||"").replace(/\/+$/,"");
  if(!base) throw new Error("no bridge");
  const res=await fetch(base+path,Object.assign({headers:{"Content-Type":"application/json"}},opts||{}));
  if(!res.ok) throw new Error("HTTP "+res.status);
  return res.json();
}
async function checkBridge(){
  if(!S.bridgeUrl){ S.bridgeOnline=false; return false; }
  try{ const h=await bridgeFetch("/v1/health",{method:"GET"}); S.bridgeOnline=!!h.ok; return S.bridgeOnline; }
  catch(e){ S.bridgeOnline=false; return false; }
}
async function bridgeChat(text){
  const r=await bridgeFetch("/v1/chat",{method:"POST",body:JSON.stringify({message:text,session_id:S.sessionId})});
  S.sessionId=r.session_id||S.sessionId;
  S.mood=r.mood||S.mood;
  if(r.relationship_stage) S.relationshipStage=r.relationship_stage;
  return {text:r.text||"",mood:r.mood||"calm",animation:r.animation||"look_at_user",
    origin:r.origin||"fallback",notice:r.model_notice||"",thinking:r.thinking_line||"",
    waiting:!!r.waiting_for_user,pending:r.pending_action||null};
}

async function bridgeChatMulti(text){
  const r=await bridgeFetch("/v1/chat/multi",{method:"POST",body:JSON.stringify({message:text,session_id:S.sessionId})});
  S.sessionId=r.session_id||S.sessionId;
  S.mood=r.mood||S.mood;
  if(r.relationship_stage) S.relationshipStage=r.relationship_stage;
  const responses = r.responses || [{text:r.text||"",mood:r.mood||"calm",animation:r.animation||"look_at_user",
    origin:r.origin||"fallback",notice:r.model_notice||"",thinking:r.thinking_line||"",
    waiting:!!r.waiting_for_user,pending:r.pending_action||null}];
  return responses;
}

async function bridgeChat(text){
  const responses = await bridgeChatMulti(text);
  return responses[0];
}

const Voice={
  synth:window.speechSynthesis, utter:null, rec:null, listening:false,
  voices(){ return this.synth?this.synth.getVoices():[]; },
  speak(text){
    if(!S.voiceEnabled || !this.synth || !text) return;
    try{ this.synth.cancel();
      this.utter=new SpeechSynthesisUtterance(text.replace(/[*#`•]/g,"").slice(0,400));
      this.utter.lang=/[\u0C00-\u0C7F]/.test(text)?"te-IN":"en-IN";
      const vs=this.voices(); const te=vs.find(v=>v.lang&&v.lang.toLowerCase().startsWith("te"))||vs.find(v=>v.lang&&v.lang.toLowerCase().includes("in"));
      if(te) this.utter.voice=te; this.utter.rate=1.02; this.utter.pitch=1.12;
      this.utter.onstart=()=>{S.speaking=true;updateChibi();};
      this.utter.onend=()=>{S.speaking=false;updateChibi();};
      this.utter.onerror=()=>{S.speaking=false;updateChibi();};
      this.synth.speak(this.utter);
    }catch(e){ S.speaking=false; updateChibi(); }
  },
  speakChunked(text){
    if(!S.voiceEnabled || !this.synth || !text) return Promise.resolve();
    return new Promise((resolve) => {
      const chunks = this.chunkText(text);
      let index = 0;
      
      const speakNext = () => {
        if (index >= chunks.length) {
          resolve();
          return;
        }
        
        const chunk = chunks[index++];
        if(!S.voiceEnabled || !this.synth) {
          resolve();
          return;
        }
        
        try{
          this.synth.cancel();
          this.utter = new SpeechSynthesisUtterance(chunk);
          this.utter.lang = /[\u0C00-\u0C7F]/.test(text) ? "te-IN" : "en-IN";
          
          const vs = this.voices();
          const te = vs.find(v => v.lang && v.lang.toLowerCase().startsWith("te")) 
            || vs.find(v => v.lang && v.lang.toLowerCase().includes("in"));
          if(te) this.utter.voice = te;
          
          this.utter.rate = 1.02;
          this.utter.pitch = 1.12;
          this.utter.volume = 1.0;
          
          this.utter.onstart = () => { S.speaking = true; updateChibi(); };
          this.utter.onend = () => {
            S.speaking = false;
            updateChibi();
            setTimeout(speakNext, 300); // Small pause between chunks
          };
          this.utter.onerror = () => {
            S.speaking = false;
            updateChibi();
            setTimeout(speakNext, 300);
          };
          this.synth.speak(this.utter);
        } catch(e) {
          S.speaking = false;
          updateChibi();
          setTimeout(speakNext, 300);
        }
      };
      
      speakNext();
    });
  },
  
  chunkText(text) {
    // Split text into natural chunks for better prosody
    // Split by sentences, then by clauses, max ~150 chars per chunk
    const sentences = text.replace(/[*#`•]/g, "").split(/(?<=[.!?।])\s+/);
    const chunks = [];
    
    for (const sentence of sentences) {
      if (sentence.length <= 150) {
        chunks.push(sentence);
      } else {
        // Split long sentences by clauses
        const clauses = sentence.split(/(?<=[,;:])/);
        let currentChunk = "";
        for (const clause of clauses) {
          if ((currentChunk + clause).length > 150) {
            if (currentChunk) chunks.push(currentChunk.trim());
            currentChunk = clause;
          } else {
            currentChunk += clause;
          }
        }
        if (currentChunk) chunks.push(currentChunk.trim());
      }
    }
    
    return chunks.filter(c => c.trim().length > 0);
  },
  
  speakChunked(text) {
    if(!S.voiceEnabled || !this.synth || !text) return Promise.resolve();
    
    const chunks = this.chunkText(text);
    let index = 0;
    
    return new Promise((resolve) => {
      const speakNext = () => {
        if (index >= chunks.length) {
          resolve();
          return;
        }
        
        if (!S.voiceEnabled || !this.synth) {
          resolve();
          return;
        }
        
        const chunk = chunks[index++];
        try {
          this.synth.cancel();
          this.utter = new SpeechSynthesisUtterance(chunk);
          this.utter.lang = /[\u0C00-\u0C7F]/.test(text) ? "te-IN" : "en-IN";
          
          const vs = this.voices();
          const te = vs.find(v => v.lang && v.lang.toLowerCase().startsWith("te")) 
            || vs.find(v => v.lang && v.lang.toLowerCase().includes("in"));
          if (te) this.utter.voice = te;
          
          this.utter.rate = 1.02;
          this.utter.pitch = 1.12;
          this.utter.volume = 1.0;
          
          this.utter.onstart = () => { S.speaking = true; updateChibi(); };
          this.utter.onend = () => {
            S.speaking = false;
            updateChibi();
            setTimeout(() => speakNext(), 300);
          };
          this.utter.onerror = () => {
            S.speaking = false;
            updateChibi();
            setTimeout(() => speakNext(), 300);
          };
          this.synth.speak(this.utter);
        } catch (e) {
          S.speaking = false;
          updateChibi();
          setTimeout(() => speakNext(), 300);
        }
      };
      
      speakNext();
    });
  },
  
  stop(){ if(this.synth) this.synth.cancel(); S.speaking=false; updateChibi(); },
  initSTT(){ const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR) return null; const r=new SR(); r.lang="te-IN"; r.interimResults=true; r.continuous=false; return r; }
};

/* v0.9 Part 8/10 -- floating companion demo. A single draggable bubble,
 * outside the phone chrome, that snaps to the nearest edge on release and
 * opens the chat view on tap. This is a demo of the *interaction model*
 * the Android FloatingCompanionService implements natively with a real
 * WindowManager overlay -- the web prototype has no equivalent of an
 * always-on-top window outside the browser tab, so this models the same
 * behavior within the page. */
function updateFloatingCompanionDemo(){
  const b=document.getElementById('ashu-floating-demo'); if(!b) return;
  b.querySelector('img').src=ASSET(ashuCurrentAsset());
  b.classList.toggle('motion-off',!!S.reducedMotion);
}
function setFloatingCompanionDemo(enabled){
  let b=document.getElementById('ashu-floating-demo');
  if(!enabled){ if(b) b.remove(); return; }
  if(b){ updateFloatingCompanionDemo(); return; }
  b=document.createElement('div'); b.id='ashu-floating-demo'; b.title='Floating Ashu (demo) -- drag me, tap me';
  b.innerHTML=`<img alt="Ashu floating companion" src="${ASSET(ashuCurrentAsset())}">`;
  document.body.appendChild(b);
  let dragging=false, moved=false, startX=0, startY=0, originLeft=0, originTop=0;
  const pointerDown=(x,y)=>{ dragging=true; moved=false; startX=x; startY=y;
    const r=b.getBoundingClientRect(); originLeft=r.left; originTop=r.top; b.classList.add('dragging'); };
  const pointerMove=(x,y)=>{ if(!dragging) return; const dx=x-startX, dy=y-startY;
    if(Math.abs(dx)>6||Math.abs(dy)>6) moved=true;
    b.style.left=Math.max(0,Math.min(window.innerWidth-64,originLeft+dx))+'px';
    b.style.top=Math.max(0,Math.min(window.innerHeight-64,originTop+dy))+'px'; };
  const pointerUp=()=>{ if(!dragging) return; dragging=false; b.classList.remove('dragging');
    if(moved){ // edge snap
      const r=b.getBoundingClientRect(); const snapLeft=(r.left+32)<window.innerWidth/2;
      b.style.left=(snapLeft?8:window.innerWidth-72)+'px';
    } else {
      route='chat'; if(typeof updateReturnGreeting==='function') updateReturnGreeting(); render(); // tap-to-open, mirrors Android's tap-to-open-app
    }
  };
  b.addEventListener('mousedown',e=>pointerDown(e.clientX,e.clientY));
  window.addEventListener('mousemove',e=>pointerMove(e.clientX,e.clientY));
  window.addEventListener('mouseup',pointerUp);
  b.addEventListener('touchstart',e=>{const t=e.touches[0];pointerDown(t.clientX,t.clientY);},{passive:true});
  b.addEventListener('touchmove',e=>{const t=e.touches[0];pointerMove(t.clientX,t.clientY);},{passive:true});
  b.addEventListener('touchend',pointerUp);
  updateFloatingCompanionDemo();
}
async function sendDraft(){
  const input=document.getElementById("draft");
  const text=(S.draft||input.value||"").trim();
  if(!text||busy) return;
  S.messages.push({from:"me",text,ts:Date.now()});
  S.draft=""; input.value=""; input.style.height="auto"; paintMessages();
  busy=true; S.thinking=true; paintMessages(); updateChibi();
  let responses;
  if(S.bridgeUrl && S.bridgeOnline){
    try{ responses=await bridgeChatMulti(text); }
    catch(e){ S.bridgeOnline=false; responses=[localBrain(text)]; S.modelNotice="Bridge lost — reply came from the offline rule brain."; }
  } else {
    if(S.bridgeUrl && !S.bridgeOnline){ S.bridgeOnline=await checkBridge(); }
    const responses = S.bridgeOnline ? (await bridgeChatMulti(text).catch(()=>[localBrain(text)])) : [localBrain(text)];
    responses = responses || [localBrain(text)];
  }
  if(responses[0]?.thinking){ 
    S.messages.push({from:"ashu",text:responses[0].thinking,origin:responses[0].origin,ts:Date.now()}); 
    paintMessages(); await sleep(380); S.messages.pop(); 
  }
  
  // Multi-message support: send each response with staggered delays
  for(let i=0; i<responses.length; i++){
    const r = responses[i];
    if(i > 0) await sleep(500 + Math.random() * 1000); // Staggered delay
    
    if(r.thinking && i === 0){ 
      S.messages.push({from:"ashu",text:r.thinking,origin:r.origin,ts:Date.now()}); 
      paintMessages(); await sleep(380); 
    }
    
    S.replyPulse=true; updateChibi();
    S.messages.push({from:"ashu",text:r.text,origin:r.origin,ts:Date.now()});
    if(r.mood) S.mood=r.mood;
    if(r.animation) playAction(r.animation);
    S.modelNotice=r.notice||"";
    S.waitingForUser=!!r.waiting;
    if(S.messages.length>400) S.messages=S.messages.slice(-400);
    save(); paintMessages(); updateChibi();
    
    if(S.voiceEnabled&&S.autoSpeak) await Voice.speakChunked(r.text);
  }
  busy=false; S.thinking=false;
}
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
function toggleMic(){
  if(!S.voiceEnabled){ toast("Voice is off — turn it on with the 🔈 button."); return; }
  const rec=Voice.initSTT();
  if(!rec){ toast("Speech-to-text not supported in this browser. Type your message instead."); 
    S.messages.push({from:"ashu",text:"🎙 This browser/device can't do speech-to-text. Type chey ra, vintunna.",origin:"rules",ts:Date.now()}); paintMessages(); return; }
  const btn=document.getElementById("mic");
  if(Voice.listening){ try{rec.stop();}catch(e){} Voice.listening=false; btn.classList.remove("listening"); btn.textContent="🎙"; updateChibi(); return; }
  rec.lang=/[\u0C00-\u0C7F]/.test(S.draft||"")?"te-IN":"te-IN";
  rec.onresult=e=>{ let txt=""; for(const res of e.results) txt+=res[0].transcript; S.draft=txt; const i=document.getElementById("draft"); if(i) i.value=txt; };
  rec.onerror=e=>{ Voice.listening=false; btn.classList.remove("listening"); btn.textContent="🎙"; updateChibi(); toast("Mic error: "+(e.error||"unknown")+". Check browser mic permission."); };
  rec.onend=()=>{ Voice.listening=false; btn.classList.remove("listening"); btn.textContent="🎙"; updateChibi(); if(S.draft.trim()) sendDraft(); };
  try{ rec.start(); Voice.listening=true; btn.classList.add("listening"); btn.textContent="■"; updateChibi(); }
  catch(e){ toast("Could not start mic."); }
}
function updateReturnGreeting(){
  if(!S.proactiveEnabled) return;
  const away=(Date.now()-S.lastReturn)/1000;
  S.lastReturn=Date.now();
  if(away>90 && dailyInitiations()<S.dailyLimit && !S.reducedMotion){
    S._initDay=new Date().toDateString(); S._initCount=dailyInitiations()+1;
    S.messages.push({from:"ashu",text:pick(B.returnGreeting),origin:"rules",ts:Date.now()});
  }
}

      preferences:{voiceEnabled:S.voiceEnabled,autoSpeak:S.autoSpeak,autoMemory:S.autoMemory,cloudFallback:S.cloudFallback,proactiveEnabled:S.proactiveEnabled,dailyLimit:S.dailyLimit},
      memories:S.memories,people:S.people,activity:S.activity,relationship:{stage:S.relationshipStage,interactions:S.interactionCount,familiarity:S.familiarity,trust:S.trust}};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="ashu-data-export.json"; a.click();
    toast("Exported ashu-data-export.json");
  };
  v.querySelector('[data-act="p-wipe"]').onclick=()=>askConfirm("Delete everything Ashu knows","This permanently deletes all memories, people, goals and activity history. It cannot be undone.",()=>{ S.memories=[];S.people=[];S.activity=[];save();renderPrivacy();toast("All local data deleted."); });
}

/* ------------------------- boot ------------------------- */
function registerPWA(){ try{ if("serviceWorker" in navigator && location.protocol!=="file:"){ navigator.serviceWorker.register("./sw.js").catch(()=>{}); } }catch(e){} }

function boot(){
  // Auto-connect when this page is served by the Python bridge (or ?bridge= given).
  try{
    const qp=(typeof location!=="undefined")?new URLSearchParams(location.search):null;
    if(qp && qp.get("bridge")) S.bridgeUrl=qp.get("bridge");
    if(!S.bridgeUrl && typeof location!=="undefined" && location.protocol.indexOf("http")===0
       && (location.port==="8765"||location.hostname==="localhost"||location.hostname==="127.0.0.1")){
      S.bridgeUrl=location.origin;
    }
  }catch(e){}
  render();
  if(S.floatingDemo) setFloatingCompanionDemo(true);
  // Proactive return greeting on returning visit
  if(S.onboarded){ updateReturnGreeting(); renderChat(); }
  // periodic boredom/attention nudge (respects limit + quiet hours)
  setInterval(()=>{
    if(!S.onboarded||!S.proactiveEnabled||S.reducedMotion) return;
    const now=Date.now(); if(now-(S._lastNudge||0)<1000*60*4) return;
    const hour=new Date().getHours(); const [sh,sm]=(S.sleepStart||"23:30").split(":").map(Number); const [wh,wm]=(S.sleepEnd||"07:00").split(":").map(Number);
    const quiet = hour>=sh || hour<wh;
    if(quiet) return;
    if(dailyInitiations()>=S.dailyLimit) return;
    const idle=(now-(Date.parse(S.lastInteractionAt||now)))/1000;
    if(idle<90) return;
    S._lastNudge=now; S._initDay=new Date().toDateString(); S._initCount=dailyInitiations()+1;
    S.messages.push({from:"ashu",text:S.attention?pick(B.attention):pick(B.boredom),origin:"rules",ts:Date.now()});
    S.mood=S.attention?"playful":"bored"; save(); if(route==="chat"){ renderChat(); } 
  },1000*60);
  // Refresh the shell once the bridge connects so the chip flips to "live bridge".
  // NOTE: this must NOT bypass the onboarding gate in render(). When it did,
  // a visitor served by the bridge landed on the chat shell with S.onboarded
  // still false, so the very first nav-tab click called render() and dumped
  // them into step 1 of onboarding instead of the screen they asked for.
  if(S.bridgeUrl) checkBridge().then(()=>{ if(route==="chat"&&S.bridgeOnline&&S.onboarded) renderShell(); });
  // greeting voice on first paint if enabled
  if(S.onboarded && S.voiceEnabled && S.autoSpeak){
    const last=S.messages[S.messages.length-1];
    if(last&&last.from==="ashu") Voice.speak(last.text);
  }
}
registerPWA();
boot();
</script>
</body>
